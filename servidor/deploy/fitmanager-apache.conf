# /etc/apache2/sites-available/fitmanager.conf
# Apache recibe las peticiones de fitmanager.sysmonitor-grupo3.online
# y se las pasa a Node, que escucha solo dentro del servidor (127.0.0.1:3000).
# "upgrade=websocket" deja pasar también el tiempo real de Socket.io.
# Certbot crea después la copia para HTTPS (fitmanager-le-ssl.conf).

<VirtualHost *:80>
    ServerName fitmanager.sysmonitor-grupo3.online

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/fitmanager_error.log
    CustomLog ${APACHE_LOG_DIR}/fitmanager_access.log combined
</VirtualHost>
